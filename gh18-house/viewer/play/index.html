<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- the page lives in /play/ but loads textures/ and models/ from the site root -->
  <script>if (!location.pathname.endsWith('/')) location.replace(location.pathname + '/' + location.search + location.hash);</script>
  <base href="../" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>GH-18 · 3D Home Tour · R1</title>
  <script>window.GH18_REV = 'r1';</script>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1d1a17" />
  <style>
    /* shown over the tour, before the drive's own styles load */
    #play-prompt { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 50; font: 600 15px Inter, system-ui, sans-serif;
      color: #f6f1e8; background: rgba(24, 21, 18, 0.72); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 999px; padding: 11px 20px; cursor: pointer; }
    #play-prompt kbd { display: inline-block; min-width: 22px; padding: 1px 6px; margin-right: 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,.3); font: 600 12px Inter, sans-serif; }
    #play-seat { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 50; font: 600 15px Inter, system-ui, sans-serif;
      color: #f6f1e8; background: rgba(24, 21, 18, 0.72); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 999px; padding: 11px 20px; cursor: pointer; }
    #play-seat kbd { display: inline-block; min-width: 22px; padding: 1px 6px; margin-right: 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,.3); font: 600 12px Inter, sans-serif; }
    #play-prompt[hidden], #play-loading[hidden], #play-seat[hidden] { display: none; }
    #play-loading { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: #1d1a17; color: #f6f1e8; font: 32px Georgia, serif; }
  </style>
  <link rel="icon" href="site/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <!--TOUR-->
  <button id="play-prompt" hidden><kbd>F</kbd> Get in the car</button>
  <button id="play-seat" hidden></button>
  <div id="play-app"></div>
  <div id="play-loading" hidden><span>♪</span></div>
  <button id="prompt" hidden></button>
  <div id="toast" hidden></div>
  <div id="bday" hidden><b>Happy birthday, Deepti</b><span>♥</span></div>
  <div id="msg" hidden><span>A message for you ♥</span><button id="msg-stop" aria-label="Stop">■</button></div>
  <div id="hud" hidden>
    <div id="bar">
      <button id="hud-menu-btn" aria-label="Menu" aria-expanded="false" title="Menu (Tab)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="chip" data-act="time" data-chip title="Time of day (T)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg><span class="val">Evening</span></button>
      <button id="tune-chip" class="chip" hidden title="Happy Birthday: pause / play"><span class="val">⏸ Happy Birthday</span></button>
      <button id="vid-chip" class="chip" hidden title="Her video: pause / play"><span class="val">⏸ Her video</span></button><button id="vid-full" class="chip" hidden title="Full screen">⛶</button>
      <span id="room-chip" class="chip" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/></svg><span class="val"></span></span>
      <nav id="hud-menu" hidden>
        <button data-act="cam" title="Camera (C)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg><span class="lb">Camera</span><span class="val">Chase</span><kbd>C</kbd></button>
        <button data-act="aids" title="Driving aids (K): Assisted · Sport · off"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.2"/><path d="M3.8 10.5h6M14.2 10.5h6M12 14.2V20.5"/></svg><span class="lb">Driving aids</span><span class="val">Assisted</span><kbd>K</kbd></button>
        <button data-act="lights" title="Headlights (L)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5c-3 .3-5 2.6-5 5.5s2 5.2 5 5.5c1.4-1.4 2-3.4 2-5.5s-.6-4.1-2-5.5z"/><path d="M14 8h6M14 12h6M14 16h6"/></svg><span class="lb">Headlights</span><span class="val">Off</span><kbd>L</kbd></button>
        <button data-act="time" title="Time of day (T)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg><span class="lb">Time of day</span><span class="val">Evening</span><kbd>T</kbd></button>
        <button data-act="music" id="music-btn" title="Music (P)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5.5l11-2v12.5"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg><span class="lb">Her songs</span><span class="val"></span><kbd>P</kbd></button>
        <button data-act="musiczone" title="Music in this room or everywhere (O)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h3l4-3.5v13L8 15H5z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6.5a7.5 7.5 0 0 1 0 11"/></svg><span class="lb">Music in</span><span class="val">This room</span><kbd>O</kbd></button>
        <button data-act="sound" title="Sound (Shift+M)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg><span class="lb">Sound</span><span class="val">On</span><kbd>⇧M</kbd></button>
        <button data-act="horn" title="Horn (H)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l9 5V5L7 10z"/><path d="M19 9.5v5"/></svg><span class="lb">Horn</span><span class="val"></span><kbd>H</kbd></button>
        <button data-act="map" title="Map: go anywhere (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5 9 4.5l6 2 5.5-2v13L15 19.5l-6-2-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg><span class="lb">Map</span><span class="val"></span><kbd>M</kbd></button>
        <button data-act="photo" title="Photo mode (V)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="12" rx="1.6"/><path d="M8.5 7l1.5-2.5h4L15.5 7"/><circle cx="12" cy="13" r="3.4"/></svg><span class="lb">Photo mode</span><span class="val"></span><kbd>V</kbd></button>
        <button data-act="goto" title="Go to a room, the studio or the court"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span class="lb">Go to…</span><span class="val"></span><i></i></button>
        <button data-act="studio" title="Go to the studio (G)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M6 21l4.5-15h3L18 21M8 15h8"/><rect x="7.5" y="6" width="9" height="6.5" rx="0.6"/></svg><span class="lb">Go to the studio</span><span class="val"></span><kbd>G</kbd></button>
        <button data-act="home" title="Back home (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg><span class="lb">Back home</span><span class="val"></span><kbd>R</kbd></button>
        <hr />
        <button data-act="tour" title="Back to the home tour (starts over)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5V9h4.5"/></svg><span class="lb">Home tour</span><span class="val">starts over</span><i></i></button>
      </nav>
    </div>
    <button id="foot-btn" data-act="foot" title="Get out / in (F)"><kbd>F</kbd><span class="val">Get out</span></button>
    <canvas id="map" width="220" height="220"></canvas>
    <div id="speedo"><b id="kmh">0</b><span>km/h</span><i id="gear">D</i></div>
    <div id="touch">
      <div class="steer"><button data-k="left">◀</button><button data-k="right">▶</button></div>
      <div class="pedals"><button data-k="brake">Brake</button><button data-k="gas">Gas</button></div>
    </div>
    <div id="credit">Car: "2022 Maruti Suzuki Baleno" by BHP3D, CC BY 4.0</div>
  </div>
  <aside id="music" hidden>
    <div class="m-head"><b>♪</b><span id="m-title">Her songs</span><button id="m-close" aria-label="Close">×</button></div>
    <div class="m-video"><div id="ytplayer"></div></div>
    <div class="m-ctrl"><button id="m-prev" aria-label="Previous">⏮</button><button id="m-play" aria-label="Play or pause">▶</button><button id="m-next" aria-label="Next">⏭</button>
      <input id="m-vol" type="range" min="0" max="100" value="70" aria-label="Volume" /></div>
  </aside>
  <div id="overlay" hidden><div class="content"></div></div>
  <script type="module" src="/src/play/entry.js"></script>
</body>
</html>
