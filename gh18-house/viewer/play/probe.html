<!doctype html><html><body style="margin:0;background:#ddd"><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { buildCharacter } from '/src/play/character.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(1200, 700); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd9d4cc);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.7;
const sun = new THREE.DirectionalLight(0xfff1e0, 2.2); sun.position.set(2, 4, 3); sun.castShadow = true; scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0xcfc6b8 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const poses = (q.get('poses') || 'stand,stand,stand,walk').split(',');
poses.forEach((pose, i) => {
  const c = buildCharacter(); scene.add(c.root);
  c.root.position.x = (i - (poses.length - 1) / 2) * 0.75;
  c.root.rotation.y = [0, -0.7, -Math.PI / 2, -0.4][i % 4];
  for (let k = 0; k < 20; k++) c.update(0.05, { pose, speed: pose === 'walk' ? 1.3 : 0 });
});
const cam = new THREE.PerspectiveCamera(30, 1200 / 700, 0.05, 50);
const z = +(q.get('z') || 4.2), y = +(q.get('y') || 1.0);
cam.position.set(0, y + 0.1, z); cam.lookAt(0, y, 0);
r.render(scene, cam); window.done = true;
</script></body></html>
