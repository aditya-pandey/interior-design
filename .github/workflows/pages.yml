# Publishes the GH-18 3D viewer to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]            # the live site is main; work happens on house-design-v1 and is merged in
    paths: ['gh18-house/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gh18-house/viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gh18-house/viewer/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_BUILD: '1'      # strips client name and address from house.json
          PLAY_PERSONAL: '1'     # /play/ includes Deepti's pack (paintings, poems, photos, song list): the owner's choice, 9 Nov 2026
          SITE_URL: https://aditya-pandey.github.io/interior-design/   # absolute link-preview URLs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh18-house/viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000       # ms; /play/ (its scanned textures and models, ~100 MB) takes Pages longer than the default 10 min to sync
