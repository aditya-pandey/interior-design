# Publishes the GH-18 3D viewer to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main, claude/zen-shannon-ilvm07]
    paths: ['gh18-house/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gh18-house/viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gh18-house/viewer/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_BUILD: '1'      # strips client name and address from house.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh18-house/viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
